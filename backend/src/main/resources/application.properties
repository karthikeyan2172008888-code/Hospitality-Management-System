# ===================================================================
# Hospitality Management System — Spring Boot Configuration
# ===================================================================

server.port=8080
server.servlet.context-path=/

# Active Profile: 'mysql' for local MySQL, 'h2' for standalone in-memory demo
spring.profiles.active=mysql

# Application Info
spring.application.name=HospitalityManagementSystem

# -------------------------------------------------------------------
# MySQL Profile Configuration (Default)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/hospitality_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Static Resources (Serve frontend from Spring Boot JAR)
spring.web.resources.static-locations=classpath:/static/,classpath:/public/

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Logging
logging.level.com.hospitality=INFO
logging.level.org.springframework.web=INFO
